<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slothmore · quick panel</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0B1016">
<link rel="stylesheet" href="/compact.css">
</head>
<body>
<div class="qp" id="qp">
  <header class="qp-top">
    <img class="qp-mark" src="/icons/mark-64.png" srcset="/icons/mark-64.png 1x, /icons/mark-128.png 2x" width="30" height="30" alt="">
    <label class="vh" for="q">Search projects, running items and ports</label>
    <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Start, open or stop…">
    <kbd class="qp-kbd" title="Enter runs the highlighted row">↵</kbd>
  </header>
  <div class="qp-status" id="status" role="status" hidden></div>
  <main class="qp-body" id="list" role="listbox" aria-label="Results"></main>
  <div class="qp-confirm" id="confirm" hidden>
    <p id="confirmText"></p>
    <div class="qp-confirm-btns">
      <button type="button" class="qb" id="confirmNo">Cancel</button>
      <button type="button" class="qb danger" id="confirmYes">Stop</button>
    </div>
  </div>
  <div class="qp-ai" id="aiStrip" hidden></div>
  <footer class="qp-foot">
    <button type="button" class="qb ghost" id="refreshBtn" title="Refresh (⌘R)">Refresh <kbd>⌘R</kbd></button>
    <button type="button" class="qb full" id="fullBtn" title="Open the full dashboard (⌘O)">Open full window <kbd>⌘O</kbd></button>
    <span class="qp-spacer"></span>
    <button type="button" class="qb danger" id="killBtn" title="Stop everything Slothmore started">Kill all mine</button>
    <button type="button" class="qb ghost" id="quitBtn" title="Quit the menu bar helper (⌘Q)">Quit <kbd>⌘Q</kbd></button>
  </footer>
</div>
<script src="/compact.js"></script>
</body>
</html>
